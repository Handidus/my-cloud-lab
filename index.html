<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Анализ канала и АЧХ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
</head>
<body class="bg-slate-900 text-white p-6">

<div class="max-w-5xl mx-auto">
    <h1 class="text-2xl font-bold text-blue-400 mb-6 text-center">Лабораторный стенд: Анализ АЧХ и BER</h1>

    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 mb-6">
        <label class="block mb-2 font-bold">Уровень сигнала (SNR): <span id="snrVal" class="text-yellow-400">12</span> дБ</label>
        <input type="range" min="0" max="15" step="0.5" value="12" id="snrSlider" class="w-full h-3 bg-slate-600 rounded-lg cursor-pointer">
        
        <div class="mt-4 grid grid-cols-2 gap-4">
            <div class="bg-slate-900 p-4 rounded text-center">
                <div class="text-slate-400 text-xs uppercase">Вероятность ошибки (BER)</div>
                <div id="berDisplay" class="text-2xl font-mono text-green-400">0.000</div>
            </div>
            <div class="bg-slate-900 p-4 rounded text-center">
                <div class="text-slate-400 text-xs uppercase">Эффективность выравнивания</div>
                <div id="effDisplay" class="text-2xl font-mono text-blue-400">95%</div>
            </div>
        </div>
    </div>

    <div id="achhPlot" class="bg-white rounded-lg mb-6" style="height:350px"></div>

    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <h2 class="font-bold mb-3 text-blue-300">Таблица соответствия (Вопрос 7)</h2>
        <table class="w-full text-sm text-left">
            <thead class="text-slate-400 border-b border-slate-600">
                <tr><th>Уровень сигнала (дБ)</th><th>Качество (эффективность)</th></tr>
            </thead>
            <tbody id="statTable"></tbody>
        </table>
    </div>
</div>

<script>
function update() {
    const snr = parseFloat(document.getElementById('snrSlider').value);
    document.getElementById('snrVal').innerText = snr;

    // Расчет BER и эффективности (логика из ваших вопросов)
    let ber, eff;
    if (snr < 6) { ber = 0.45; eff = 0; }
    else if (snr <= 10) { ber = 0.1; eff = 70; }
    else if (snr <= 12) { ber = 0.01; eff = 85; }
    else if (snr <= 13) { ber = 0.001; eff = 98; }
    else { ber = 0.5; eff = 1; } // Перебор мощности

    document.getElementById('berDisplay').innerText = ber.toFixed(4);
    document.getElementById('effDisplay').innerText = eff + "%";

    // График АЧХ
    const x = Array.from({length: 64}, (_, i) => i);
    const noise = (13 - snr) * 0.2;
    const achh = x.map(i => -Math.abs(i-32)*0.2 + (Math.random()-0.5)*noise);
    
    Plotly.newPlot('achhPlot', [{
        y: achh, 
        type: 'scatter', 
        name: 'АЧХ после LMS',
        line: {color: '#22c55e', width: 2}
    }], {
        title: 'Разброс величин АЧХ (Вопрос 6)',
        margin: {t:40, b:30},
        yaxis: {range: [-10, 5]}
    });

    // Обновление таблицы
    const table = document.getElementById('statTable');
    const ranges = ["Ниже 6", "6-8", "8-10", "10-12", "12-13", "Выше 13"];
    const effs = ["0%", "70%", "75%", "85%", "95-100%", "1%"];
    table.innerHTML = ranges.map((r, i) => `
        <tr class="${(i === Math.floor(snr/3) || (snr > 13 && i==5)) ? 'bg-blue-900' : ''}">
            <td class="p-2 border-b border-slate-700">${r} дБ</td>
            <td class="p-2 border-b border-slate-700">${effs[i]}</td>
        </tr>
    `).join('');
}

document.getElementById('snrSlider').oninput = update;
update();
</script>
</body>
</html>
