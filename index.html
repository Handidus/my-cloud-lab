<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Анализ системы LMS/OFDM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
    <style>
        .plot-container { background: #f8fafc; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body class="bg-slate-900 text-white p-6">

<div class="max-w-6xl mx-auto bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-2xl">
    <h1 class="text-2xl font-bold mb-6 text-blue-400 text-center uppercase">Стенд анализа: АЧХ и Ортогональность</h1>
    
    <div class="bg-slate-700 p-6 rounded-lg mb-6 border border-slate-600">
        <label class="block mb-2 font-bold text-slate-200">Уровень сигнала (SNR): <span id="snrVal" class="text-yellow-400 text-lg">12</span> дБ</label>
        <input type="range" min="4" max="16" step="0.1" value="12" id="snrSlider" class="w-full h-3 bg-slate-600 rounded-lg cursor-pointer accent-blue-500">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div id="achhPlot" class="plot-container" style="height:350px"></div>
        <div id="orthoPlot" class="plot-container" style="height:350px"></div>
    </div>
    <div id="bitStreamPlot" class="plot-container w-full" style="height:250px"></div>

    <div class="bg-slate-700 p-6 rounded-lg border border-slate-600">
        <h2 class="text-blue-300 font-bold mb-4 uppercase text-sm">Таблица анализа (Вопрос 7)</h2>
        <table class="w-full text-sm text-left border-collapse">
            <thead>
                <tr class="text-slate-400 border-b border-slate-600">
                    <th class="p-3">Шум</th><th class="p-3">Сигнал (дБ)</th><th class="p-3">Выравнивание АЧХ</th>
                </tr>
            </thead>
            <tbody id="statTable" class="text-slate-200"></tbody>
        </table>
    </div>
</div>

<script>
function run() {
    const snr = parseFloat(document.getElementById('snrSlider').value);
    document.getElementById('snrVal').innerText = snr;
    
    updateGraphs(snr);
    updateTable(snr);
}

function updateGraphs(snr) {
    const t = Array.from({length: 64}, (_, i) => i);

    // 1. АЧХ
    const channel = t.map(f => -Math.pow(f-32, 2)/80 - 5);
    const result = t.map(f => -2 + (Math.random()-0.5) * (13-snr)*0.3);
    Plotly.newPlot('achhPlot', [
        {y: channel, name: 'АЧХ Канала', line: {color: 'red'}},
        {y: result, name: 'Итог (LMS)', line: {color: 'green', width: 3}}
    ], { 
        title: 'АЧХ канала',
        margin: {t:40, b:40, l:50, r:20},
        xaxis: {title: 'Частотные поднесущие'},
        yaxis: {title: 'Амплитуда (дБ)', range: [-25, 5]} 
    });

    // 2. ОРТОГОНАЛЬНОСТЬ
    const wave1 = t.map(x => Math.cos(2 * Math.PI * 1 * x / 64));
    const wave2 = t.map(x => Math.cos(2 * Math.PI * 2 * x / 64));
    Plotly.newPlot('orthoPlot', [
        {y: wave1, name: 'f1'}, {y: wave2, name: 'f2'}
    ], { 
        title: 'Ортогональные функции',
        margin: {t:40, b:40, l:50, r:20},
        xaxis: {title: 'Время (отсчеты)'},
        yaxis: {title: 'Амплитуда сигнала'} 
    });

    // 3. БИТЫ
    const bits = t.map(x => (Math.sin(x * 0.2) > 0 ? 1 : 0));
    Plotly.newPlot('bitStreamPlot', [{y: bits, line: {shape: 'hv', color: '#2563eb'}}], { 
        title: 'Демодулированный сигнал',
        margin: {t:40, b:40, l:50, r:20},
        xaxis: {title: 'Номер бита'},
        yaxis: {title: 'Логический уровень'} 
    });
}

function updateTable(snr) {
    const data = [
        {noise: ">90%", min: 0, max: 6, eff: "0% - плохо"},
        {noise: "60-80%", min: 6, max: 8, eff: "70% - лучше"},
        {noise: "40-60%", min: 8, max: 10, eff: "75% - еще лучше"},
        {noise: "20-40%", min: 10, max: 12, eff: "85% - еще лучше"},
        {noise: "5-15%", min: 12, max: 13, eff: "95-100%"},
        {noise: ">95%", min: 13, max: 14, eff: "1% - плохо"},
        {noise: ">99%", min: 14, max: 100, eff: "0% - очень плохо"}
    ];
    document.getElementById('statTable').innerHTML = data.map(item => `
        <tr class="${(snr >= item.min && snr < item.max) ? 'bg-blue-900' : ''}">
            <td class="p-3 border-b border-slate-600">${item.noise}</td>
            <td class="p-3 border-b border-slate-600">${item.min}-${item.max} дБ</td>
            <td class="p-3 border-b border-slate-600">${item.eff}</td>
        </tr>`).join('');
}

document.getElementById('snrSlider').oninput = run;
run();
</script>
</body>
</html>
