<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>OFDM Лабораторный стенд</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
</head>
<body class="bg-slate-900 text-white p-6">

<div class="max-w-6xl mx-auto bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-2xl">
    <h1 class="text-xl font-bold mb-6 text-blue-400 text-center uppercase">Лабораторный стенд: Анализ OFDM и LMS</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="bg-slate-700 p-4 rounded-lg">
            <label class="text-xs font-bold uppercase text-slate-400">SNR: <span id="snrVal" class="text-yellow-400">12</span> дБ</label>
            <input type="range" min="4" max="16" step="0.1" value="12" id="snrSlider" class="w-full h-3 accent-blue-500 cursor-pointer">
        </div>
        <div class="bg-slate-900 p-4 rounded text-center border border-slate-600">
            <div class="text-slate-400 text-xs uppercase">Вероятность ошибки (BER)</div>
            <div id="berDisplay" class="text-2xl font-mono text-green-400">0.000</div>
        </div>
        <div class="bg-slate-900 p-4 rounded text-center border border-slate-600">
            <div class="text-slate-400 text-xs uppercase">Эффективность</div>
            <div id="effDisplay" class="text-2xl font-mono text-blue-400">95%</div>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div id="orthoPlot" class="bg-white rounded p-2" style="height:250px"></div>
        <div id="achhPlot" class="bg-white rounded p-2" style="height:250px"></div>
    </div>

    <div id="bitStreamPlot" class="bg-white rounded p-2 mb-4" style="height:200px"></div>

    <div class="bg-slate-700 p-4 rounded-lg border border-slate-600">
        <h2 class="text-blue-400 font-bold mb-3 uppercase text-sm">Таблица соответствия эффективности</h2>
        <table class="w-full text-sm text-left text-slate-200">
            <thead class="text-slate-400 border-b border-slate-600">
                <tr><th class="py-2">Уровень сигнала (дБ)</th><th class="py-2">Эффективность выравнивания</th></tr>
            </thead>
            <tbody id="statTable"></tbody>
        </table>
    </div>
</div>

<script>
function update() {
    const snr = parseFloat(document.getElementById('snrSlider').value);
    document.getElementById('snrVal').innerText = snr;
    
    // Логика расчета BER и эффективности
    let ber, eff;
    if (snr < 6) { ber = 0.49; eff = 0; }
    else if (snr >= 6 && snr <= 13) { ber = (13 - snr) * 0.01; eff = 70 + (snr - 6) * 4; }
    else if (snr > 13 && snr <= 14) { ber = 0.35; eff = 1; }
    else { ber = 0.45; eff = 0; }

    document.getElementById('berDisplay').innerText = ber.toFixed(3);
    document.getElementById('effDisplay').innerText = eff.toFixed(0) + "%";

    // 1. OFDM Ортогональность
    const t = Array.from({length: 100}, (_, i) => i);
    Plotly.newPlot('orthoPlot', [
        {y: t.map(x => Math.sin(2 * Math.PI * x / 50)), name: 'f1', line: {color: '#3b82f6'}},
        {y: t.map(x => Math.sin(2 * Math.PI * 2 * x / 50)), name: 'f2', line: {color: '#f59e0b'}}
    ], { 
        title: 'Ортогональные функции (OFDM)',
        xaxis: {title: 'Время (отсчеты)'},
        yaxis: {title: 'Амплитуда'},
        margin: {t:40, b:40, l:40, r:20} 
    });

    // 2. АЧХ
    const x = Array.from({length: 64}, (_, i) => i);
    const fading = x.map(i => 2 * Math.sin(i / 5) + (Math.random() - 0.5) * (14 - snr) * 0.2);
    Plotly.newPlot('achhPlot', [{y: fading, name: 'АЧХ', line: {color: '#ef4444', shape: 'spline'}}], 
    { 
        title: 'АЧХ Канала (Замирания)',
        xaxis: {title: 'Частота'},
        yaxis: {title: 'Амплитуда (дБ)'},
        margin: {t:40, b:40, l:40, r:20} 
    });

    // 3. Биты
    Plotly.newPlot('bitStreamPlot', [
        {y: [0, 1, 1, 0, 1, 0, 0, 1, 1], name: 'Вход', line: {shape: 'hv', color: '#64748b'}},
        {y: [0, 1, 0, 0, 1, 1, 0, 1, 0], name: 'Выход', line: {shape: 'hv', color: '#22c55e'}}
    ], { 
        title: 'Поток бит (Вход vs Выход)',
        xaxis: {title: 'Битовый интервал'},
        yaxis: {title: 'Уровень'},
        margin: {t:40, b:40, l:40, r:20} 
    });

    // 4. Таблица
    const ranges = [
        { label: "Ниже 6 дБ", eff: "0% - плохо" },
        { label: "6-8 дБ", eff: "70% - лучше" },
        { label: "8-10 дБ", eff: "75% - ещё лучше" },
        { label: "10-12 дБ", eff: "85% - ещё лучше" },
        { label: "12-13 дБ", eff: "95-100%" },
        { label: "Выше 13 дБ", eff: "1% - плохо" },
        { label: "Выше 14 дБ", eff: "0% - очень плохо" }
    ];
    document.getElementById('statTable').innerHTML = ranges.map((r, i) => `
        <tr class="${(i === Math.floor(snr/3) || (snr > 13 && i >= 5)) ? 'bg-blue-900' : ''}">
            <td class="py-2 border-b border-slate-600">${r.label}</td>
            <td class="py-2 border-b border-slate-600">${r.eff}</td>
        </tr>`).join('');
}

document.getElementById('snrSlider').oninput = update;
update();
</script>
</body>
</html>
