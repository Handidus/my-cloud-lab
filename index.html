<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Анализ демодуляции и АЧХ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
</head>
<body class="bg-slate-900 text-white p-6">

<div class="max-w-6xl mx-auto bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-2xl">
    <h1 class="text-xl font-bold mb-6 text-blue-400 text-center uppercase">Лабораторный стенд: Анализ OFDM и LMS</h1>
    
    <div class="bg-slate-700 p-6 rounded-lg mb-6 border border-slate-600">
        <label class="block mb-2 font-bold text-sm text-slate-300">
            Отношение сигнал/шум (SNR): <span id="snrVal" class="text-yellow-400 text-lg">12</span> дБ
        </label>
        <input type="range" min="4" max="15" step="0.5" value="12" id="snrSlider" class="w-full h-3 bg-slate-600 rounded-lg cursor-pointer accent-blue-500">
        
        <div class="mt-6 grid grid-cols-2 gap-4">
            <div class="bg-slate-900 p-4 rounded text-center border border-slate-600">
                <div class="text-slate-400 text-xs uppercase">Вероятность ошибки (BER)</div>
                <div id="berDisplay" class="text-3xl font-mono font-bold text-green-400">0.000</div>
            </div>
            <div class="bg-slate-900 p-4 rounded text-center border border-slate-600">
                <div class="text-slate-400 text-xs uppercase">Эффективность выравнивания</div>
                <div id="effDisplay" class="text-3xl font-mono font-bold text-blue-400">95%</div>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <div id="achhPlot" class="bg-white rounded-lg shadow" style="height:300px"></div>
        <div id="orthoPlot" class="bg-white rounded-lg shadow" style="height:300px"></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div id="constPlot" class="bg-white rounded-lg shadow" style="height:250px"></div>
        <div class="bg-slate-700 p-6 rounded-lg border border-slate-600">
            <h2 class="text-blue-400 font-bold mb-3 uppercase text-sm">Таблица эффективности</h2>
            <table class="w-full text-sm text-left text-slate-200">
                <thead class="text-slate-400 uppercase">
                    <tr><th class="pb-2">SNR (дБ)</th><th class="pb-2">Эффективность</th></tr>
                </thead>
                <tbody id="statTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
function update() {
    const snr = parseFloat(document.getElementById('snrSlider').value);
    document.getElementById('snrVal').innerText = snr;
    
    // Логика параметров
    let ber, eff;
    if (snr < 6) { ber = 0.45; eff = 0; }
    else if (snr <= 10) { ber = 0.1; eff = 70; }
    else if (snr <= 12) { ber = 0.01; eff = 85; }
    else if (snr <= 13) { ber = 0.001; eff = 98; }
    else { ber = 0.5; eff = 1; }

    document.getElementById('berDisplay').innerText = ber.toFixed(3);
    document.getElementById('effDisplay').innerText = eff + "%";

    // 1. Ортогональность
    const t = Array.from({length: 50}, (_, i) => i);
    Plotly.newPlot('orthoPlot', [
        {y: t.map(x => Math.cos(2 * Math.PI * x / 50)), name: 'f1', line: {color: '#3b82f6'}},
        {y: t.map(x => Math.cos(2 * Math.PI * 2 * x / 50)), name: 'f2', line: {color: '#f59e0b'}}
    ], { title: 'Ортогональные функции', margin: {t:40, b:30, l:40, r:20} });

    // 2. АЧХ
    const x = Array.from({length: 64}, (_, i) => i);
    const noise = Math.max(0, (13 - snr) * 0.5);
    const achhData = x.map(i => -Math.abs(i-32)*0.15 + (Math.random()-0.5)*noise);
    Plotly.newPlot('achhPlot', [{y: achhData, type: 'scatter', name: 'АЧХ', line: {color: '#ef4444'}}], 
    { title: 'АЧХ Канала', margin: {t:40, b:30, l:40, r:20}, yaxis: {range: [-10, 2]} });

    // 3. Созвездие
    let rx = Array.from({length: 200}, () => ({
        x: (Math.random()>0.5 ? 1 : -1) + (Math.random()-0.5)*(ber*5),
        y: (Math.random()>0.5 ? 1 : -1) + (Math.random()-0.5)*(ber*5)
    }));
    Plotly.newPlot('constPlot', [{x: rx.map(p=>p.x), y: rx.map(p=>p.y), mode: 'markers', marker: {size: 5, color: '#3b82f6'}}], 
    { title: 'Созвездие (QPSK)', margin: {t:40, b:30, l:40, r:20} });

    // 4. Таблица
    const ranges = ["< 6", "6-10", "10-12", "12-13", "> 13"];
    const effs = ["0%", "70%", "85%", "98%", "1%"];
    document.getElementById('statTable').innerHTML = ranges.map((r, i) => `
        <tr class="${i === Math.floor(snr/4) ? 'text-yellow-400 font-bold' : ''}">
            <td class="py-1">${r}</td><td>${effs[i]}</td>
        </tr>`).join('');
}

document.getElementById('snrSlider').oninput = update;
update();
</script>
</body>
</html>
