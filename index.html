<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Анализ LMS/OFDM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
</head>
<body class="bg-slate-900 text-white p-6">

<div class="max-w-6xl mx-auto bg-slate-800 p-6 rounded-xl border border-slate-700">
    <h1 class="text-2xl font-bold mb-2 text-blue-400 text-center uppercase">Стенд анализа LMS/OFDM</h1>
    
    <div class="text-center mb-6 bg-slate-700 py-3 rounded-lg border border-slate-600">
        <span class="text-gray-400 uppercase text-xs font-bold">Вероятность ошибки (BER): </span>
        <span id="berDisplay" class="text-3xl font-mono text-red-400">0.00000</span>
    </div>

    <div class="bg-slate-700 p-6 rounded-lg mb-6 border border-slate-600">
        <label class="block mb-2 font-bold text-slate-200">SNR (сигнал/шум): <span id="snrVal" class="text-yellow-400 text-lg">12</span> дБ</label>
        <input type="range" min="4" max="16" step="0.1" value="12" id="snrSlider" class="w-full h-3 bg-slate-600 rounded-lg accent-blue-500 cursor-pointer">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div id="achhPlot" style="background:#fff; border-radius:8px; height:350px"></div>
        <div id="orthoPlot" style="background:#fff; border-radius:8px; height:350px"></div>
    </div>
    <div id="bitStreamPlot" style="background:#fff; border-radius:8px; height:250px" class="mb-6"></div>

    <div class="bg-slate-700 p-6 rounded-lg border border-slate-600">
        <h2 class="text-blue-300 font-bold mb-4 uppercase text-sm">Таблица эффективности</h2>
        <table class="w-full text-sm text-left text-slate-200">
            <thead><tr class="text-slate-400 border-b border-slate-600"><th class="p-3">Шум</th><th class="p-3">Сигнал (дБ)</th><th class="p-3">Эффективность</th></tr></thead>
            <tbody id="statTable"></tbody>
        </table>
    </div>
</div>

<script>
function run() {
    const snr = parseFloat(document.getElementById('snrSlider').value);
    document.getElementById('snrVal').innerText = snr;
    
    // Расчет BER
    const ber = (snr < 6) ? 0.49 : (snr > 13) ? 0.35 : (13 - snr) * 0.08;
    document.getElementById('berDisplay').innerText = ber.toFixed(5);
    
    updateGraphs(snr);
    updateTable(snr);
}

function updateGraphs(snr) {
    const t = Array.from({length: 64}, (_, i) => i);

    // АЧХ: Ось X - частота, Ось Y - дБ
    Plotly.newPlot('achhPlot', [
        {y: t.map(f => -Math.pow(f-32, 2)/80 - 5), name: 'АЧХ Канала', line: {color: 'red'}},
        {y: t.map(f => -2 + (Math.random()-0.5) * (13-snr)*0.4), name: 'Итог (LMS)', line: {color: 'green', width: 3}}
    ], { title: 'АЧХ Канала', xaxis: {title: 'Частотные поднесущие (индекс)'}, yaxis: {title: 'Амплитуда (дБ)'}, margin: {t:40, b:40} });

    // Ортогональность: Ось X - отсчеты времени, Ось Y - амплитуда (ед.)
    Plotly.newPlot('orthoPlot', [
        {y: t.map(x => Math.cos(2*Math.PI*1*x/64)), name: 'f1'},
        {y: t.map(x => Math.cos(2*Math.PI*2*x/64)), name: 'f2'}
    ], { title: 'Ортогональные функции', xaxis: {title: 'Отсчеты времени'}, yaxis: {title: 'Амплитуда (ед.)'}, margin: {t:40, b:40} });

    // Сигнал: Ось X - индекс бита, Ось Y - лог. уровень
    Plotly.newPlot('bitStreamPlot', [{y: t.map(x => (Math.sin(x*0.2) > 0 ? 1 : 0)), line: {shape: 'hv', color: '#2563eb'}}], { 
        title: 'Биты', xaxis: {title: 'Индекс бита'}, yaxis: {title: 'Логический уровень (0/1)'}, margin: {t:40, b:40} 
    });
}

function updateTable(snr) {
    const data = [
        {noise: ">90%", min: 0, max: 6, eff: "0%"},
        {noise: "60-80%", min: 6, max: 8, eff: "70%"},
        {noise: "40-60%", min: 8, max: 10, eff: "75%"},
        {noise: "20-40%", min: 10, max: 12, eff: "85%"},
        {noise: "5-15%", min: 12, max: 13, eff: "95-100%"},
        {noise: ">95%", min: 13, max: 100, eff: "1%"}
    ];
    document.getElementById('statTable').innerHTML = data.map(item => `
        <tr class="${(snr >= item.min && snr < item.max) ? 'bg-blue-900' : ''}">
            <td class="p-3 border-b border-slate-600">${item.noise}</td>
            <td class="p-3 border-b border-slate-600">${item.min}-${item.max} дБ</td>
            <td class="p-3 border-b border-slate-600">${item.eff}</td>
        </tr>`).join('').replace('13-100', 'Выше 13');
}

document.getElementById('snrSlider').oninput = run;
run();
</script>
</body>
</html>
