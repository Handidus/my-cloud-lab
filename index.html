<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>OFDM Лабораторная модель</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
</head>
<body class="bg-slate-900 text-white p-6">

<div class="max-w-6xl mx-auto bg-slate-800 p-6 rounded-xl border border-slate-700">
    <h1 class="text-xl font-bold mb-6 text-blue-400 text-center">OFDM Система с коррекцией канала</h1>
    
    <div class="bg-slate-700 p-6 rounded-lg mb-6 border border-slate-600">
        <label class="block mb-2 font-bold text-sm text-slate-300">
            Отношение сигнал/шум (SNR): <span id="snrVal" class="text-yellow-400">12</span> дБ
        </label>
        <input type="range" min="0" max="20" step="0.5" value="12" id="snrSlider" class="w-full h-3 bg-slate-600 rounded-lg accent-blue-500 cursor-pointer">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div id="orthoPlot" class="bg-white rounded-lg" style="height:300px"></div>
        <div id="achhPlot" class="bg-white rounded-lg" style="height:300px"></div>
    </div>
</div>

<script>
function update() {
    const snr = parseFloat(document.getElementById('snrSlider').value);
    document.getElementById('snrVal').innerText = snr;
    
    // --- 1. ЭМУЛЯЦИЯ OFDM (Ортогональность) ---
    // В OFDM мы используем набор ортогональных поднесущих.
    // Ортогональность означает, что интеграл произведения двух сигналов за период равен нулю.
    const samples = 100;
    const t = Array.from({length: samples}, (_, i) => i);
    
    // Каждая поднесущая k имеет частоту f = k/T
    const subcarrier1 = t.map(x => Math.sin(2 * Math.PI * 1 * x / samples));
    const subcarrier2 = t.map(x => Math.sin(2 * Math.PI * 2 * x / samples));
    
    Plotly.newPlot('orthoPlot', [
        {y: subcarrier1, name: 'Поднесущая 1', line: {color: '#3b82f6'}},
        {y: subcarrier2, name: 'Поднесущая 2', line: {color: '#f59e0b'}}
    ], { title: 'Ортогональные поднесущие (OFDM)', margin: {t:40, b:30, l:40, r:20} });

    // --- 2. РЕАЛИСТИЧНАЯ АЧХ (Rayleigh Fading) ---
    // Вместо треугольника создаем модель с "замираниями" (fading).
    // Реальный канал имеет случайные провалы амплитуды на разных частотах.
    const x = Array.from({length: 64}, (_, i) => i);
    const fading = x.map(i => {
        // Случайный набросок частотной характеристики (рэлеевский характер)
        return 2 * Math.sin(i / 5) * Math.cos(i / 10) + (Math.random() - 0.5) * (20 - snr) * 0.2;
    });

    Plotly.newPlot('achhPlot', [{
        y: fading, 
        type: 'scatter', 
        name: 'АЧХ канала', 
        line: {color: '#ef4444', width: 2, shape: 'spline'}
    }], { 
        title: 'Реалистичная АЧХ с замираниями', 
        margin: {t:40, b:30, l:40, r:20},
        yaxis: {range: [-5, 5]}
    });
}

document.getElementById('snrSlider').oninput = update;
update();
</script>
</body>
</html>
