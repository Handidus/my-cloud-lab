<!DOCTYPE html>
<html lang="ru">
<head>
    <title>OFDM СИМУЛЯТОР (ДВИЖОК)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
</head>
<body class="bg-slate-950 text-white p-4">

<div class="max-w-6xl mx-auto bg-slate-900 p-6 border border-slate-700 rounded-xl">
    <h1 class="text-2xl font-bold text-center text-blue-400 mb-6">OFDM СИМУЛЯТОР С LMS-ЭКВАЛАЙЗЕРОМ</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
            <label class="font-bold">SNR: <span id="snrVal" class="text-yellow-400">12</span> дБ</label>
            <input type="range" min="0" max="20" step="0.5" value="12" id="snrSlider" class="w-full accent-blue-500">
            <div class="mt-4 text-center">
                <div class="text-xs text-slate-400">Вероятность ошибки (BER)</div>
                <div id="berVal" class="text-2xl font-mono text-red-400 font-bold">0.000</div>
            </div>
        </div>
        <div id="plotAchh" class="bg-white rounded-lg h-40"></div>
    </div>

    <div id="plotSignal" class="bg-white rounded-lg h-64 mb-4"></div>
    
    <div id="plotConstellation" class="bg-white rounded-lg h-64"></div>
</div>

<script>
/**
 * OFDM ДВИЖОК:
 * 1. Генерация QAM символов
 * 2. Прохождение через частотно-селективный канал (дуга АЧХ)
 * 3. LMS-эквалайзер (инверсия канала)
 */
function runEngine() {
    const snr = parseFloat(document.getElementById('snrSlider').value);
    document.getElementById('snrVal').innerText = snr;

    const N = 64; // Количество поднесущих
    const bits = Array.from({length: N}, () => Math.random() > 0.5 ? 1 : -1);

    // Моделирование канала (частотная селективность)
    const channel = bits.map((b, i) => {
        const attenuation = Math.sin(Math.PI * i / N); // Та самая "дуга"
        const noise = (Math.random() - 0.5) * Math.pow(10, -snr/20);
        return (b * attenuation) + noise;
    });

    // LMS-Эквалайзер (Математическое выравнивание)
    const corrected = channel.map((val, i) => {
        const est = Math.sin(Math.PI * i / N);
        return val / (est + 0.01); // Восстановление амплитуды
    });

    // Расчет BER
    const errors = bits.filter((b, i) => (corrected[i] > 0 ? 1 : -1) !== b).length;
    document.getElementById('berVal').innerText = (errors / N).toFixed(4);

    // Отрисовка
    Plotly.newPlot('plotAchh', [{y: bits.map((_, i) => Math.sin(Math.PI * i / N)), name: 'Канал'}, {y: corrected, name: 'Выход'}], {title: 'АЧХ (Канал vs LMS)', margin: {t:30, b:30}});
    Plotly.newPlot('plotSignal', [{y: bits, name: 'Вход', line: {shape: 'hv'}}, {y: corrected, name: 'Прием', mode: 'markers'}], {title: 'Сигнальный поток', margin: {t:30, b:30}});
    Plotly.newPlot('plotConstellation', [{x: corrected, y: bits, mode: 'markers'}], {title: 'Созвездие (Демодуляция)', xaxis: {title: 'I'}, yaxis: {title: 'Q'}, margin: {t:30, b:30}});
}

document.getElementById('snrSlider').oninput = runEngine;
runEngine();
</script>
</body>
</html>
