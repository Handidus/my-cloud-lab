<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>OFDM Лабораторный стенд</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
</head>
<body class="bg-slate-900 text-white p-6">

<div class="max-w-6xl mx-auto bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-2xl">
    <h1 class="text-xl font-bold mb-6 text-blue-400 text-center">Лабораторный стенд: Анализ OFDM и LMS</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="bg-slate-700 p-4 rounded-lg">
            <label class="text-xs font-bold uppercase text-slate-400">SNR: <span id="snrVal" class="text-yellow-400">12</span> дБ</label>
            <input type="range" min="0" max="20" step="0.5" value="12" id="snrSlider" class="w-full h-3 accent-blue-500 cursor-pointer">
        </div>
        <div class="bg-slate-900 p-4 rounded text-center border border-slate-600">
            <div class="text-slate-400 text-xs uppercase">BER</div>
            <div id="berDisplay" class="text-2xl font-mono text-green-400">0.000</div>
        </div>
        <div class="bg-slate-900 p-4 rounded text-center border border-slate-600">
            <div class="text-slate-400 text-xs uppercase">Эффективность</div>
            <div id="effDisplay" class="text-2xl font-mono text-blue-400">95%</div>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div id="orthoPlot" class="bg-white rounded p-2" style="height:250px"></div>
        <div id="achhPlot" class="bg-white rounded p-2" style="height:250px"></div>
    </div>
    <div id="bitStreamPlot" class="bg-white rounded p-2 mb-4" style="height:200px"></div>

    <div class="bg-slate-700 p-4 rounded-lg border border-slate-600 text-sm">
        <table class="w-full text-left">
            <thead><tr class="text-slate-400 uppercase"><th>Диапазон SNR</th><th>Качество связи</th></tr></thead>
            <tbody id="statTable"></tbody>
        </table>
    </div>
</div>

<script>
function update() {
    const snr = parseFloat(document.getElementById('snrSlider').value);
    document.getElementById('snrVal').innerText = snr;
    
    // ЛОГИКА: 6-13 дБ — целевой диапазон
    let ber, eff, status;
    if (snr >= 6 && snr <= 13) {
        ber = 0.001 + (13 - snr) * 0.005;
        eff = 95 + (snr - 9) * 0.5; // пиковая эффективность
        status = "Оптимально";
    } else {
        ber = 0.2;
        eff = 40;
        status = "Низкое";
    }
    
    document.getElementById('berDisplay').innerText = ber.toFixed(3);
    document.getElementById('effDisplay').innerText = eff.toFixed(0) + "%";

    // 1. OFDM Ортогональность
    Plotly.newPlot('orthoPlot', [
        {y: Array.from({length: 100}, (_,i) => Math.sin(2*Math.PI*i/50)), name: 'f1', line: {color: '#3b82f6'}},
        {y: Array.from({length: 100}, (_,i) => Math.sin(2*Math.PI*2*i/50)), name: 'f2', line: {color: '#f59e0b'}}
    ], { 
        title: 'Ортогональные функции (OFDM)',
        xaxis: {title: 'Время (отсчеты)'},
        yaxis: {title: 'Амплитуда'},
        margin: {t:40, b:40, l:40, r:20} 
    });

    // 2. АЧХ
    const achhData = Array.from({length: 64}, (_,i) => 2 * Math.sin(i/5) + (Math.random()-0.5)*(20-snr)*0.1);
    Plotly.newPlot('achhPlot', [{y: achhData, name: 'АЧХ', line: {color: '#ef4444', shape: 'spline'}}], 
    { 
        title: 'АЧХ Канала (Замирания)',
        xaxis: {title: 'Частота (поднесущие)'},
        yaxis: {title: 'Амплитуда (дБ)'},
        margin: {t:40, b:40, l:40, r:20} 
    });

    // 3. Биты
    Plotly.newPlot('bitStreamPlot', [
        {y: [0, 1, 1, 0, 1, 0, 0, 1, 1], name: 'Вход', line: {shape: 'hv', color: '#64748b'}},
        {y: [0, 1, 0, 0, 1, 1, 0, 1, 0], name: 'Выход', line: {shape: 'hv', color: '#22c55e'}}
    ], { 
        title: 'Сравнение потоков данных',
        xaxis: {title: 'Битовый интервал'},
        yaxis: {title: 'Логический уровень'},
        margin: {t:40, b:40, l:40, r:20} 
    });

    // 4. Таблица
    document.getElementById('statTable').innerHTML = `
        <tr class="${snr < 6 ? 'text-red-400' : ''}"><td>< 6 дБ</td><td>Критическое</td></tr>
        <tr class="${snr >= 6 && snr <= 13 ? 'text-yellow-400 font-bold' : ''}"><td>6-13 дБ</td><td>Оптимальное</td></tr>
        <tr class="${snr > 13 ? 'text-blue-400' : ''}"><td>> 13 дБ</td><td>Высокое</td></tr>
    `;
}
document.getElementById('snrSlider').oninput = update;
update();
</script>
</body>
</html>
